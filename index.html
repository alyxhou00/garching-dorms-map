<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Full-bleed map with one floating detail panel and a pager, like a place card. */
:root {
  --bg: #f4f3ef; --panel: #ffffff; --raise: #f1efe9; --ink: #1f1e1b; --muted: #6d6a62; --line: #e4e1d8;
  --stwm: #c2603e; --eswm: #3f6d8f; --priv: #5d7a55; --good: #2f7a4b; --warn: #a8701a;
  --shadow: 0 8px 30px rgba(0,0,0,.12);
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1c1d20; --raise: #2a2b2f; --ink: #ecebe6; --muted: #a29e94; --line: #34353a;
    --stwm: #e0805c; --eswm: #79a6c8; --priv: #8fb185; --good: #6cc08d; --warn: #e0b05a;
    --shadow: 0 8px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
#map { position: absolute; inset: 0; }

/* markers: the root element is left untouched so MapLibre can position it */
.mk-in {
  display: block; padding: 4px 10px; border-radius: 9px; cursor: pointer;
  background: var(--panel); color: var(--ink); border: 1.5px solid var(--c);
  font: 500 12px/1.3 var(--font); white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.18);
  transition: transform .15s, background .15s, color .15s;
}
.mk-in:hover { transform: translateY(-1px); }
.mk.north .mk-in { border-style: dashed; background: var(--raise); }
.mk.north.on .mk-in { border-style: solid; background: var(--c); }
.mk.on { z-index: 3; }
.mk.on .mk-in { background: var(--c); color: var(--panel); transform: scale(1.08); }


/* U-Bahn stations: blue square U, label beside it */
.stn { pointer-events: none; }
.stn-in { display: flex; align-items: center; gap: 5px; transform: translateX(calc(50% - 9px)); }
.stn .u {
  width: 18px; height: 18px; border-radius: 4px; background: #0065ae; color: #fff;
  font: 700 12px/18px var(--font); text-align: center; box-shadow: 0 0 0 2px var(--panel);
}
.stn .s {
  font-size: 11.5px; font-weight: 500; color: #0065ae; white-space: nowrap;
  text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel), 0 0 3px var(--panel);
}
@media (prefers-color-scheme: dark) { .stn .s { color: #7fb2e5; } }
body.far .stn .s { display: none; }
.sw.u6 { width: 14px; height: 4px; border-radius: 2px; background: #0065ae; }
.legend .ux { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 3px; background: #0065ae; color: #fff; font: 700 9px/1 var(--font); }

/* legend */
.legend {
  position: absolute; top: 12px; left: 12px; z-index: 2; display: grid; gap: 4px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  font-size: 12px; color: var(--muted); box-shadow: var(--shadow);
}
.legend b { color: var(--ink); font-weight: 600; font-size: 13px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.sw.ln { background: transparent; border: 1.5px solid var(--muted); width: 14px; height: 10px; }
.sw.ln.dash { border-style: dashed; }
.areas { display: flex; gap: 6px; margin-top: 4px; }
.areas button { font: 500 12px var(--font); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); color: var(--ink); cursor: pointer; }

/* panel */
.panel {
  position: absolute; top: 12px; right: 12px; bottom: 12px; width: 350px; z-index: 4;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel[hidden] { display: none; }
.p-head { position: relative; padding: 18px 18px 14px; border-top: 4px solid var(--c); display: grid; gap: 4px; }
.close {
  position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 8px;
  border: 0; background: var(--raise); color: var(--ink); cursor: pointer; display: grid; place-items: center;
}
.op { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--c); font-weight: 600; }
h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; padding-right: 40px; text-wrap: balance; }
.meta { color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 8px; margin-top: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 9px;
  background: var(--raise); color: var(--ink); text-decoration: none; font-weight: 500; font-size: 13px;
  border: 1px solid var(--line);
}
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.btn:hover { filter: brightness(1.06); }
.p-body { flex: 1; overflow-y: auto; padding: 4px 18px 16px; display: grid; gap: 14px; align-content: start; }
.label { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; }
.chip.ok { color: var(--good); } .chip.check { color: var(--warn); }
dl { margin: 0; display: grid; grid-template-columns: 54px 1fr; gap: 8px 12px; }
dt { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-top: 2px; }
dd { margin: 0; font-size: 13.5px; }
.num { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
.rev { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.rv-row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: start; }
.rv-k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.rv-k.good { color: var(--good); } .rv-k.other { color: var(--muted); } .rv-k.bad { color: var(--warn); }
.rev ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.rev li { padding-left: 12px; position: relative; }
.rev li::before { content: ""; position: absolute; left: 0; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.rev li.none { padding-left: 0; color: var(--muted); }
.rev li.none::before { display: none; }
.rv-basis { font-size: 12px; color: var(--muted); }
.p-foot { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-top: 1px solid var(--line); }
.p-foot button {
  width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--raise);
  color: var(--ink); cursor: pointer; display: grid; place-items: center;
}
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
button:focus-visible, a:focus-visible, .mk-in:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.maplibregl-ctrl-group { background: var(--panel) !important; border: 1px solid var(--line); box-shadow: var(--shadow) !important; }
.maplibregl-ctrl-group button + button { border-top-color: var(--line) !important; }
@media (prefers-color-scheme: dark) { .maplibregl-ctrl-icon { filter: invert(1); } }

@media (max-width: 640px) {
  .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 56%; }
  .legend { top: 8px; left: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</section>

const U6_COLOR = "#0065ae";
function addU6() {

  map.addSource("u6", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: U6_LINE } } });

const stnMarkers = U6_STOPS.map(([n, lng, lat]) => {

const markers = DORMS.map((d, i) => {
  const root = document.createElement("div");
  root.className = "mk" + (d.area === "north" ? " north" : "");
  const inner = document.createElement("span");
  inner.className = "mk-in"; inner.textContent = d.short; inner.tabIndex = 0;
  inner.setAttribute("role", "button"); inner.setAttribute("aria-label", d.name);
  inner.style.setProperty("--c", COL[d.ch]);
  inner.addEventListener("click", () => show(i, false));

  if (d.nudge || d.nudgeX) inner.style.translate = `${d.nudgeX || 0}px ${d.nudge || 0}px`;
  return new maplibregl.Marker({ element: root, anchor: "bottom" }).setLngLat([d.lng, d.lat]).addTo(map);
});

let cur = 0;
function show(i, fly) {
  cur = (i + DORMS.length) % DORMS.length;
  const d = DORMS[cur];
  const panel = $("panel");
  panel.hidden = false;
  panel.style.setProperty("--c", COL[d.ch]);
  $("p-op").textContent = d.op + (d.area === "north" ? " · München-Nord" : " · Garching");

  $("p-meta").textContent = `${d.rating} · ${d.street}`;
  $("p-dir").href = `https://www.openstreetmap.org/directions?route=%3B${d.lat}%2C${d.lng}#map=16/${d.lat}/${d.lng}`;

  $("p-how").textContent = d.how; $("p-when").textContent = d.when;
  $("p-rent").textContent = d.rent; $("p-wait").textContent = d.wait;
  $("p-note").textContent = d.note;
  const fill = (id, arr) => $(id).replaceChildren(...(arr.length ? arr : ["Nothing mentioned"]).map(x => { const li = document.createElement("li"); li.textContent = x; if (!arr.length) li.className = "none"; return li; }));
  fill("p-good", d.rev.good); fill("p-bad", d.rev.bad);
  $("p-other").replaceChildren(...(d.other.length ? d.other : ["Nothing found outside Google Maps"]).map(x => { const li = document.createElement("li"); li.textContent = x; if (!d.other.length) li.className = "none"; return li; }));

  markers.forEach((m, j) => m.getElement().classList.toggle("on", j === cur));
  if (fly) {
    const narrow = innerWidth <= 640;
    map.flyTo({ center: [d.lng, d.lat], zoom: Math.max(map.getZoom(), 15),
      padding: narrow ? { bottom: innerHeight * .56 } : { right: 380 }, duration: reduce ? 0 : 800 });
  }
}
$("prev").addEventListener("click", () => show(cur - 1, true));
$("next").addEventListener("click", () => show(cur + 1, true));
$("close").addEventListener("click", () => { $("panel").hidden = true; markers.forEach(m => m.getElement().classList.remove("on")); });
const pad = innerWidth <= 640 ? { top: 40, bottom: innerHeight * .58, left: 30, right: 30 } : { top: 60, bottom: 60, left: 60, right: 400 };
$("go-g").addEventListener("click", () => map.fitBounds([[11.642, 48.2485], [11.664, 48.2605]], { padding: pad, duration: reduce ? 0 : 900 }));
$("go-n").addEventListener("click", () => map.fitBounds([[11.558, 48.180], [11.634, 48.213]], { padding: pad, duration: reduce ? 0 : 900 }));
show(0, false);
