<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dorms Along the U6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="map" aria-label="Map of student dorms along the U6, Garching to Münchner Freiheit"></div>

<div class="legend" aria-label="Legend">
  <b>Student dorms along the U6</b>
  <div id="legend-items"></div>
  <label class="areas">Zoom to
    <select id="go-area">
      <option value="all">All areas</option>
    </select>
  </label>
</div>

<section class="panel" id="panel" aria-live="polite">
  <div class="p-head">
    <button class="close" id="close" type="button" aria-label="Close panel">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="op" id="p-op"></div>
    <h1 id="p-name"></h1>
    <div class="meta" id="p-meta"></div>
    <div class="u6row" id="p-u6"></div>
    <div class="actions">
      <a class="btn primary" id="p-dir" target="_blank" rel="noopener">Directions</a>
      <a class="btn icon" id="p-web" target="_blank" rel="noopener" aria-label="Official page" title="Official page">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.4"/><path d="M1.7 8h12.6M8 1.7c1.8 1.9 2.6 4 2.6 6.3S9.8 12.4 8 14.3C6.2 12.4 5.4 10.3 5.4 8S6.2 3.6 8 1.7z" stroke="currentColor" stroke-width="1.4"/></svg>
      </a>
    </div>
  </div>
  <div class="p-body">
    <div class="label">Can you apply?</div>
    <div class="chips" id="p-chips"></div>
    <dl>
      <dt>How</dt><dd id="p-how"></dd>
      <dt>When</dt><dd id="p-when"></dd>
      <dt>Rent</dt><dd class="num" id="p-rent"></dd>
      <dt>Wait</dt><dd class="num" id="p-wait"></dd>
    </dl>
    <div class="sec">
      <div class="label">Room types</div>
      <ul class="rooms" id="p-rooms"></ul>
    </div>
    <div class="sec">
      <div class="label">Getting to the U6</div>
      <ol class="conn" id="p-conn"></ol>
      <p class="cn-alt" id="p-conn-alt"></p>
      <p class="cn-campus"><span id="p-campus"></span><span class="cn-src"> · MVG route planner, Monday about 8:00</span></p>
    </div>
    <p class="note" id="p-note"></p>
    <div class="parts" id="p-parts" hidden>
      <div class="label" id="p-parts-label">Made up of</div>
      <ul id="p-parts-list"></ul>
    </div>
    <div class="rev">
      <div class="label">What reviewers say</div>
      <div class="rv-row"><span class="rv-k good">Liked</span><ul id="p-good"></ul></div>
      <div class="rv-row"><span class="rv-k bad">Watch out</span><ul id="p-bad"></ul></div>
      <div class="rv-basis" id="p-basis"></div>
      <div class="rv-row"><span class="rv-k other">Elsewhere</span><ul id="p-other"></ul></div>
    </div>
  </div>
  <div class="p-foot">
    <button type="button" id="prev" aria-label="Previous dorm"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="count" id="count"></span>
    <button type="button" id="next" aria-label="Next dorm"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
